
<script>
(function() {
  window.google = window.google || {};
  window.google.script = window.google.script || {};
  
  function createRunner(successHandler, failureHandler) {
    return new Proxy({}, {
      get: function(target, prop) {
        if (prop === 'withSuccessHandler') {
          return function(fn) { return createRunner(fn, failureHandler); };
        }
        if (prop === 'withFailureHandler') {
          return function(fn) { return createRunner(successHandler, fn); };
        }
        return function(...args) {
          fetch('/api/' + prop, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ args: args })
          })
          .then(r => r.json())
          .then(res => {
            if (res.ok && successHandler) successHandler(res.data);
            else if (!res.ok && failureHandler) failureHandler(res.error || new Error('API Error'));
          })
          .catch(e => {
            if (failureHandler) failureHandler(e);
            else console.error('API Error:', e);
          });
        };
      }
    });
  }
  
  window.google.script.run = createRunner(null, null);
})();
</script>

<script>

      const toneMap = { blue: "tone-blue", green: "tone-green", amber: "tone-amber", violet: "tone-violet", teal: "tone-teal", slate: "tone-slate" };
      const iconMap = { feed: "🐟", pond: "📍", solar: "⛽", permit: "📄", waste: "♻️", gear: "⚙️" };
      let MAXMAR_LOGO_SRC = "";
      let dashboardData = null;

      function hydrateLogoImages() {
        if (!MAXMAR_LOGO_SRC) return;
        const bootLogo = document.getElementById("bootLogo");
        const brandLogo = document.getElementById("brandLogo");
        const topLogo = document.getElementById("topLogo");
        const bootLogoImg = document.getElementById("bootLogoImg");

        if (brandLogo) brandLogo.src = MAXMAR_LOGO_SRC;
        if (topLogo) topLogo.src = MAXMAR_LOGO_SRC;

      function loadLogoSource() {
        loadLargeString("getLogoChunksCount", "getLogoChunk")
          .then((logoSrc) => {

          })
          .catch((err) => {
            console.error("Failed to load logo chunks:", err);
          });

      function initBootCanvas() {
        const canvas = document.getElementById("bootCanvas");
        if (!canvas) return () => {};
        const ctx = canvas.getContext("2d");
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;
        
        window.addEventListener("resize", () => {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
        });

        // Space particles
        const particles = [];
        const numParticles = 40;
        for (let i = 0; i < numParticles; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 80 + 40,
            color: `rgba(${Math.floor(Math.random() * 20)}, ${Math.floor(Math.random() * 80 + 40)}, ${Math.floor(Math.random() * 150 + 100)}, ${Math.random() * 0.12 + 0.03})`,
            vx: Math.random() * 0.6 - 0.3,
            vy: Math.random() * 0.4 - 0.2
          });
        }

        // Tiny stars
        const stars = [];
        const numStars = 60;
        for (let i = 0; i < numStars; i++) {
          stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 1.5 + 0.5,
            opacity: Math.random() * 0.6 + 0.2,
            blinkSpeed: Math.random() * 0.02 + 0.005
          });
        }

        let animationFrameId;
        function animate() {
          ctx.fillStyle = "#000000";
          ctx.fillRect(0, 0, w, h);

          // Draw space nebula glow (radial gradient)
          const grad = ctx.createRadialGradient(w/2, h/2, 50, w/2, h/2, Math.max(w, h));
          grad.addColorStop(0, "rgba(8, 20, 60, 0.45)");
          grad.addColorStop(0.5, "rgba(2, 6, 20, 0.2)");
          grad.addColorStop(1, "#000000");
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);

          // Draw nebula particles (smoke)
          particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;

            // wrap around
            if (p.x < -p.r) p.x = w + p.r;
            if (p.x > w + p.r) p.x = -p.r;
            if (p.y < -p.r) p.y = h + p.r;
            if (p.y > h + p.r) p.y = -p.r;

            ctx.beginPath();
            const radGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
            radGrad.addColorStop(0, p.color);
            radGrad.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = radGrad;
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          });

          // Draw stars
          stars.forEach(s => {
            s.opacity += s.blinkSpeed;
            if (s.opacity > 0.8 || s.opacity < 0.2) s.blinkSpeed = -s.blinkSpeed;
            ctx.beginPath();
            ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(animate);
        }

        animate();

        return () => {
          cancelAnimationFrame(animationFrameId);
        };
      }

      function loadLargeString(countMethod, chunkMethod) {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler((count) => {
              if (count === 0) {
                resolve("");
                return;
              }
              const chunks = new Array(count);
              function loadNext(index) {
                if (index === count) {
                  resolve(chunks.join(""));
                  return;
                }
                google.script.run
                  .withSuccessHandler((chunk) => {
                    chunks[index] = chunk;
                    loadNext(index + 1);
                  })
                  .withFailureHandler((err) => {
                    reject(err);
                  })
                  [chunkMethod](index);
              }
              loadNext(0);
            })
            .withFailureHandler((err) => {
              reject(err);
            })
            [countMethod]();
        });
      }

      function runBootSequence() {
        const logoContainer = document.getElementById("bootLogoContainer");
        const bootLogoImg = document.getElementById("bootLogoImg");
        if (bootLogoImg && MAXMAR_LOGO_SRC) {
          bootLogoImg.src = MAXMAR_LOGO_SRC;

        setTimeout(() => {
          const bootScreen = document.getElementById("bootScreen");
          if (bootScreen) {
            bootScreen.classList.add("hidden");
            document.body.classList.remove("booting");
            setTimeout(() => {
              bootScreen.remove();
            }, 1000);
          }
        }, 1500);
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function renderDashboard(data) {
        dashboardData = data;
        currentAccessId = data.defaultAccessId || (data.accessProfiles[0] && data.accessProfiles[0].id) || "";
        selectedCompanyId = getAccessScopedSelectedCompanyId();
        document.getElementById("loadingState").hidden = true;
        
        // Buka kunci panel modul
        const modulPanel = document.querySelector('.sidebar-modul');
        if (modulPanel) modulPanel.classList.remove('locked');

        document.getElementById("dashboardRoot").hidden = false;
        
        const pageSub = document.getElementById("pageSubtitle");
        if (pageSub) pageSub.textContent = data.subtitle;
        
        const genAt = document.getElementById("generatedAt");
        if (genAt) genAt.textContent = `Update ${data.generatedAt} | ${data.buildVersion}`;
        
        renderTopbar();
        renderMetricCards(getVisibleMetrics());
        renderClusterMini(getVisibleClusters());
        renderTips(data.tips || []);
        renderAccessOptions(data.accessProfiles || []);
        renderClusters(getVisibleClusters(), getVisibleCompanies());
        renderNotices(data.notices || []);
        renderSelectedCompany();
        renderModules(data.modules || []);
        bindAccessEvents();
        initSidebarModulCollapse();
      }

      function getCurrentAccessProfile() {
        return (dashboardData && (dashboardData.accessProfiles || []).find((profile) => profile.id === currentAccessId)) || null;
      }

      function getVisibleCompanies() {
        if (!dashboardData) return [];
        const access = getCurrentAccessProfile();
        if (!access || access.scope === "all") return dashboardData.companies;
        return dashboardData.companies.filter((company) => company.id === access.companyId);
      }

      function getVisibleClusters() {
        if (!dashboardData) return [];
        const visibleCompanyIds = new Set(getVisibleCompanies().map((company) => company.id));
        return dashboardData.clusters.filter((cluster) => cluster.companyIds.some((id) => visibleCompanyIds.has(id)));
      }

      function getVisibleMetrics() {
        if (!dashboardData) return [];
        const visibleCompanies = getVisibleCompanies();
        const visibleClusters = getVisibleClusters();
        const activeCompanies = visibleCompanies.filter((company) => company.status === "Aktif").length;
        return [
          { label: "Total Cluster", value: visibleClusters.length, detail: "Cluster yang bisa diakses" },
          { label: "Total Perusahaan", value: visibleCompanies.length, detail: "Perusahaan dalam scope login" },
          { label: "Perusahaan Aktif", value: activeCompanies, detail: `${visibleCompanies.length - activeCompanies} masih setup` },
          { label: "Live Site", value: visibleCompanies.reduce((sum, company) => sum + company.metrics.liveSites, 0), detail: "Akumulasi tampilan detail" },
          { label: "User Aktif", value: visibleCompanies.reduce((sum, company) => sum + company.metrics.activeUsers, 0), detail: "Akun operasional terdaftar" }
        ];
      }

      function getAccessScopedSelectedCompanyId() {
        const visibleCompanies = getVisibleCompanies();
        if (!visibleCompanies.length) return "";
        if (visibleCompanies.some((company) => company.id === selectedCompanyId)) return selectedCompanyId;
        const preferred = getCurrentAccessProfile();
        if (preferred && preferred.scope === "company" && preferred.companyId) return preferred.companyId;
        return visibleCompanies[0].id;
      }

        root.querySelectorAll("[data-company-id]").forEach((button) => {

            // Sembunyikan sidebar modul secara otomatis jika tidak sedang dipin
            if (!isModulPinned) {
              collapseModulSidebar();

            // Reset state aktif submenu modul agar konsisten

            renderClusters(dashboardData.clusters, dashboardData.companies);
            renderSelectedCompany();
            
            // Sinkronisasi kelas active ke sidebar list perusahaan

                item.classList.add('active');

                const parentClusterItem = parentList.previousElementSibling;
                if (parentList && !parentList.classList.contains('open')) {

          });

      function drawChart(chart) {
        window.__companyChartData = chart;
        const canvas = document.getElementById("companyChart");
        const context = canvas.getContext("2d");
        const pixelRatio = window.devicePixelRatio || 1;
        const bounds = canvas.getBoundingClientRect();
        const width = bounds.width || canvas.width;
        const height = bounds.height || canvas.height;
        canvas.width = width * pixelRatio;
        canvas.height = height * pixelRatio;
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        context.clearRect(0, 0, width, height);

        const padding = { top: 18, right: 18, bottom: 34, left: 26 };
        const plotWidth = width - padding.left - padding.right;
        const plotHeight = height - padding.top - padding.bottom;
        const maxValue = Math.max(...chart.series.flatMap((item) => item.values), 1);

        context.strokeStyle = "rgba(148, 163, 184, 0.22)";
        for (let step = 0; step <= 4; step += 1) {
          const y = padding.top + (plotHeight / 4) * step;
          context.beginPath();
          context.moveTo(padding.left, y);
          context.lineTo(width - padding.right, y);
          context.stroke();
        }

        context.fillStyle = "#64748b";
        context.font = "12px Plus Jakarta Sans";
        chart.labels.forEach((label, index) => {
          const x = padding.left + (plotWidth / (chart.labels.length - 1 || 1)) * index;
          context.fillText(label, x - 10, height - 10);
        });

        chart.series.forEach((series) => {
          context.beginPath();
          context.lineWidth = 3;
          context.strokeStyle = series.color;
          series.values.forEach((value, index) => {
            const x = padding.left + (plotWidth / (series.values.length - 1 || 1)) * index;
            const y = padding.top + plotHeight - (value / maxValue) * plotHeight;
            if (index === 0) context.moveTo(x, y);
            else context.lineTo(x, y);
          });
          context.stroke();

          series.values.forEach((value, index) => {
            const x = padding.left + (plotWidth / (series.values.length - 1 || 1)) * index;
            const y = padding.top + plotHeight - (value / maxValue) * plotHeight;
            context.beginPath();
            context.fillStyle = series.color;
            context.arc(x, y, 4, 0, Math.PI * 2);
            context.fill();
          });
        });
      }

      // ── Pinch-to-Zoom untuk HP Android ─────────────────────────────────────
      // Target: #zoomHost (scrollable). Zoom = CSS zoom layout.
      (function() {
        var host    = document.getElementById("zoomHost");
        var layout  = document.getElementById("dashboardLayout");
        var curScale = 1;
        var pinching = false;
        var startDist = 0, startScale = 1;
        var startScrollX = 0, startScrollY = 0;
        var startMidX = 0, startMidY = 0;

        function getDistance(t) {
          var dx = t[0].clientX - t[1].clientX;
          var dy = t[0].clientY - t[1].clientY;
          return Math.sqrt(dx * dx + dy * dy);
        }
        function getMid(t) {
          return {
            x: (t[0].clientX + t[1].clientX) / 2,
            y: (t[0].clientY + t[1].clientY) / 2
          };
        }
        function applyZoom() {
          layout.style.zoom = curScale;
          layout.style.height = (100 / (curScale || 1)) + "vh";
        }

        // Auto-fit agar di HP langsung tampil full layout (1280px) fit ke lebar layar HP
        function fitToScreen() {
          if (window.innerWidth < 1280) {
            curScale = window.innerWidth / 1280;
          } else {
            curScale = 1;
          }
          applyZoom();
        }

        // Jalankan fitToScreen saat pertama kali dimuat
        fitToScreen();
        // Ulangi beberapa kali setelah boot screen hilang agar presisi
        setTimeout(fitToScreen, 500);
        setTimeout(fitToScreen, 1500);

        // Auto-fit saat orientasi HP diputar (portrait <-> landscape)
        window.addEventListener("resize", function() {
          if (!pinching) {
            fitToScreen();
          }
        });

        host.addEventListener("touchstart", function(e) {
          if (e.touches.length === 2) {
            pinching    = true;
            startDist   = getDistance(e.touches);
            startScale  = curScale;
            var m       = getMid(e.touches);
            startMidX   = m.x;
            startMidY   = m.y;
            startScrollX = host.scrollLeft;
            startScrollY = host.scrollTop;
          }
        }, { passive: true });

        host.addEventListener("touchmove", function(e) {
          if (e.touches.length === 2 && pinching) {
            e.preventDefault();
            var newDist  = getDistance(e.touches);
            // Batas minimal zoom diatur sangat kecil agar bisa mencubit mengecil di HP
            var minLimit = window.innerWidth < 1280 ? (window.innerWidth / 1280) * 0.3 : 0.15;
            curScale     = Math.max(minLimit, Math.min(4, startScale * (newDist / startDist)));
            var m        = getMid(e.touches);
            var scaleRatio = curScale / startScale;
            host.scrollLeft = (startScrollX + startMidX) * scaleRatio - m.x;
            host.scrollTop  = (startScrollY + startMidY) * scaleRatio - m.y;
            applyZoom();
          }
        }, { passive: false });

        host.addEventListener("touchend", function(e) {
          if (e.touches.length < 2) {
            pinching = false;
            // Hanya snap kembali jika skala dicubit sangat ekstrem kecil (di bawah 40% lebar layar)
            var fitScale = window.innerWidth < 1280 ? (window.innerWidth / 1280) : 1;
            if (curScale < fitScale * 0.4) {
              fitToScreen();
              host.scrollLeft = 0;
              host.scrollTop  = 0;
            }
          }
        }, { passive: true });
      })();

        if (normalized.includes('hm') || normalized.includes('km') || normalized.includes('jam')) return '🚚';
        if (normalized.includes('gudang') || normalized.includes('inventory')) return '🏢';
        if (normalized.includes('solar') || normalized.includes('bbm') || normalized.includes('bakar')) return '⛽';
        if (normalized.includes('limbah') || normalized.includes('b3') || normalized.includes('recycle')) return '♻️';
        if (normalized.includes('izin') || normalized.includes('perizinan') || normalized.includes('legal')) return '📝';
        if (normalized.includes('po') || normalized.includes('surabaya') || normalized.includes('purchase')) return '🛍️';
        if (normalized.includes('keuangan') || normalized.includes('uang') || normalized.includes('finance') || normalized.includes('kas')) return '🪙';

      function toggleSubmenu(el, subMenuId) {
        const subMenu = document.getElementById(subMenuId);
        if (!subMenu) return;
        
        const isOpen = subMenu.classList.contains('open');
        
        // Toggle submenu terpilih
        if (isOpen) {
          subMenu.classList.remove('open');
          el.classList.remove('open');
          // Tutup kategori di dalamnya
          subMenu.querySelectorAll('.sub-category-container').forEach(sc => sc.classList.remove('open'));
          subMenu.querySelectorAll('.submenu-category').forEach(sc => sc.classList.remove('open'));
        } else {
          subMenu.classList.add('open');
          el.classList.add('open');
          // Otomatis buka kategori di dalamnya agar user langsung melihat item
          subMenu.querySelectorAll('.sub-category-container').forEach(sc => sc.classList.add('open'));

        }
      }

      function openWebAppUrl(event, url) {
        event.stopPropagation();
        
        // Hilangkan class active dari modul/submenu lain
        document.querySelectorAll('.modul-item').forEach(item => item.classList.remove('active'));
        document.querySelectorAll('.modul-list .submenu-item').forEach(item => item.classList.remove('active'));
        
        const el = event.currentTarget;
        el.classList.add('active');
        
        // Highlight juga modul induknya
        const parentGroup = el.closest('.modul-group');
        if (parentGroup) {
          const parentItem = parentGroup.querySelector('.modul-item');
          if (parentItem) parentItem.classList.add('active');
        }
        
        // Tambahkan context cluster dan company ke URL
        let finalUrl = url;
        if (finalUrl && finalUrl.trim() !== "") {
          try {
            // Check if URL is a JSON string for company-specific routing
            if (finalUrl.startsWith('{')) {
               const urlMap = JSON.parse(finalUrl);
               finalUrl = urlMap[selectedCompanyId] || urlMap['DEFAULT'];
               if (!finalUrl) {
                 alert("Akses Ditolak:\nPerusahaan " + selectedCompanyId + " belum dikonfigurasi untuk modul ini (Data / Folder belum tersedia).");
                 return;
               }
            }
          } catch(e) {}

          if (finalUrl) {
            const sep = finalUrl.includes('?') ? '&' : '?';
            const company = getVisibleCompanies().find(c => c.id === selectedCompanyId);
            const currentClusterId = company ? company.cluster : '';
            const companyCode = company ? (company.code || '') : '';
            finalUrl += `${sep}lokasi=${encodeURIComponent(companyCode)}&clusterId=${encodeURIComponent(currentClusterId)}&companyId=${encodeURIComponent(selectedCompanyId || '')}&v=${Date.now()}`;
          }
        }
        
        // Alihkan layar ke Module View (iframe)
        document.getElementById("dashboardRoot").hidden = true;
        const viewContainer = document.getElementById("moduleView");
        viewContainer.hidden = false;
        
        viewContainer.innerHTML = `
          <div class="iframe-container" style="width:100%; height:100%; display:flex; flex-direction:column; min-height:0;">

      // Collapsible Sidebar Modul Logic
      let isModulPinned = false; try { isModulPinned = localStorage.getItem("isModulPinned") === "true"; } catch(e) {}
      let isModulHovered = false;

      function initSidebarModulCollapse() {
        const sidebar = document.getElementById("sidebarModul");
        const toggle = document.getElementById("sidebarModulToggle");
        if (!sidebar || !toggle) return;
        
        // Hover listeners
        sidebar.addEventListener("mouseenter", () => {
          isModulHovered = true;
          expandModulSidebar();
        });
        sidebar.addEventListener("mouseleave", () => {
          isModulHovered = false;
          checkAndCollapseModulSidebar();
        });
        
        toggle.addEventListener("mouseenter", () => {
          isModulHovered = true;
          expandModulSidebar();
        });
        toggle.addEventListener("mouseleave", () => {
          isModulHovered = false;
          checkAndCollapseModulSidebar();
        });

        // Click listener on toggle triangle button
        toggle.addEventListener("click", (e) => {
          toggleSidebarModulManual();
        });

        // Set awal berdasarkan pin state yang tersimpan
        if (isModulPinned) {
          expandModulSidebar();
        } else {
          collapseModulSidebar();
        }
        updatePinButtonUI();
      }

      function expandModulSidebar() {
        const layout = document.querySelector(".layout");
        const sidebar = document.getElementById("sidebarModul");
        const toggleIcon = document.getElementById("toggleTriangle");
        if (!layout || !sidebar || !toggleIcon) return;
        
        layout.classList.add("modul-expanded");
        sidebar.classList.remove("collapsed");
        toggleIcon.textContent = "◀";
      }

      function collapseModulSidebar() {
        const layout = document.querySelector(".layout");
        const sidebar = document.getElementById("sidebarModul");
        const toggleIcon = document.getElementById("toggleTriangle");
        if (!layout || !sidebar || !toggleIcon) return;
        
        layout.classList.remove("modul-expanded");
        sidebar.classList.add("collapsed");
        toggleIcon.textContent = "▶";
      }

      function checkAndCollapseModulSidebar() {
        setTimeout(() => {
          if (!isModulPinned && !isModulHovered) {
            collapseModulSidebar();
          }
        }, 200);
      }

      function togglePinSidebarModul(event) {
        if (event) event.stopPropagation();
        
        isModulPinned = !isModulPinned;
        localStorage.setItem("isModulPinned", isModulPinned);
        
        if (isModulPinned) {
          expandModulSidebar();
        } else {
          if (!isModulHovered) {
            collapseModulSidebar();
          }
        }
        updatePinButtonUI();
      }

      function toggleSidebarModulManual() {
        isModulPinned = !isModulPinned;
        localStorage.setItem("isModulPinned", isModulPinned);
        if (isModulPinned) {
          expandModulSidebar();
        } else {
          collapseModulSidebar();
        }
        updatePinButtonUI();
      }

      function updatePinButtonUI() {
        const pinBtn = document.getElementById("pinButton");
        if (!pinBtn) return;
        
        if (isModulPinned) {
          pinBtn.classList.add("pinned");
          pinBtn.innerHTML = 
            '<svg class="pin-icon" style="transform: scale(1.5); color: var(--sky);" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              '<line x1="12" y1="17" x2="12" y2="22"></line>' +
              '<path d="M5 17h14v-1.76a2 2 0 0 0-.44-1.24l-2.78-3.58A2 2 0 0 1 15 9.18V5a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4.18a2 2 0 0 1-.78 1.24l-2.78 3.58A2 2 0 0 0 5 15.24z"></path>' +
            '</svg>' +
            '<span class="pin-text" style="margin-left: 8px;">Pinned</span>';
        } else {
          pinBtn.classList.remove("pinned");
          pinBtn.innerHTML = 
            '<svg class="pin-icon" style="transform: scale(1.5); color: #64748b;" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              '<line x1="2" y1="2" x2="22" y2="22"></line>' +
              '<line x1="12" y1="17" x2="12" y2="22"></line>' +
              '<path d="M9 10.76a2 2 0 0 1-1.11 1.79 4 4 0 0 0-2.3 3.62C5.53 16.63 6 17 6.63 17h11.5c.2 0 .39-.05.56-.15"></path>' +
              '<path d="M15 10V5a2 2 0 0 0-2-2H9.5a2 2 0 0 0-2 2v2.58"></path>' +
            '</svg>' +
            '<span class="pin-text" style="margin-left: 8px;">Pin</span>';
        }
      }

      function toggleSidebarCluster(el, listId) {
        const list = document.getElementById(listId);
        if (!list) return;
        
        const isOpen = list.classList.contains('open');
        
        // Hapus active dari semua cluster terlebih dulu
        document.querySelectorAll('#clusterMiniList .modul-item').forEach(item => item.classList.remove('active'));
        
        if (isOpen) {
          list.classList.remove('open');
          el.classList.remove('open');
          // Jika cluster ditutup, hapus active-nya juga
          el.classList.remove('active');
        } else {
          list.classList.add('open');
          el.classList.add('open');
          // Tandai cluster ini sebagai ACTIVE (beri aksen biru)
          el.classList.add('active');
        }
      }

      function selectCompanyFromSidebar(companyId) {
        selectedCompanyId = companyId;
        
        // Sinkronisasi kelas active ke sidebar list perusahaan
        document.querySelectorAll('.sidebar-comp-item').forEach(item => {
          item.classList.remove('active');
          if (item.getAttribute('data-id') === companyId) {
            item.classList.add('active');
            
            // Pastikan cluster induknya juga tetap .active (aksen biru tetap tampil)
            const parentList = item.closest('.submenu-container');
            if (parentList) {
              const parentClusterEl = parentList.previousElementSibling;
              if (parentClusterEl && parentClusterEl.classList.contains('modul-item')) {
                // Hapus active dari semua cluster dulu
                document.querySelectorAll('#clusterMiniList .modul-item').forEach(c => c.classList.remove('active'));
                // Set aktif hanya cluster induk dari PT yang dipilih
                parentClusterEl.classList.add('active');
                // Pastikan cluster terbuka
                parentList.classList.add('open');
                parentClusterEl.classList.add('open');
              }
            }
          }
        });
        
        // Kembali ke dashboard utama agar memperlihatkan panel metrik & detail perusahaan yang baru dipilih!
        document.getElementById("dashboardRoot").hidden = false;
        document.getElementById("moduleView").hidden = true;
        
        // Sembunyikan sidebar modul secara otomatis jika tidak sedang dipin
        if (!isModulPinned) {
          collapseModulSidebar();
        }
        
        // Reset state aktif submenu modul agar konsisten
        document.querySelectorAll('.modul-list .submenu-item').forEach(item => item.classList.remove('active'));
        
        // Redraw content & middle list
        renderClusters(dashboardData.clusters, dashboardData.companies);
        renderSelectedCompany();
      }

      function updateLiveWeather(clusterName) {
        const coords = {
          "ntb": { lat: -8.65, lng: 116.32 },
          "bali": { lat: -8.20, lng: 114.95 },
          "jawa": { lat: -7.25, lng: 112.75 },
          "madura": { lat: -7.01, lng: 113.86 },
          "sulawesi": { lat: -1.25, lng: 122.50 }
        };
        
        const key = String(clusterName || "").toLowerCase().trim();
        const coord = coords[key] || coords["ntb"];
        const weatherLoc = document.getElementById("weatherLocation");
        if (weatherLoc) {
          weatherLoc.textContent = "📍 " + clusterName;
        }
        
        const url = "https://api.open-meteo.com/v1/forecast?latitude=" + coord.lat + "&longitude=" + coord.lng + "&current=temperature_2m,relative_humidity_2m,weather_code";
        
        fetch(url)
          .then(res => res.json())
          .then(data => {
            const current = data.current;
            if (current) {
              const temp = Math.round(current.temperature_2m);
              const hum = current.relative_humidity_2m;
              const code = current.weather_code;
              
              let desc = "Cerah Berawan";
              let icon = "⛅";
              
              if (code === 0) {
                desc = "Cerah";
                icon = "☀️";
              } else if (code === 1 || code === 2) {
                desc = "Cerah Berawan";
                icon = "⛅";
              } else if (code === 3) {
                desc = "Berawan";
                icon = "☁️";
              } else if (code >= 45 && code <= 48) {
                desc = "Berkabut";
                icon = "🌫️";
              } else if (code >= 51 && code <= 55) {
                desc = "Gerimis";
                icon = "🌦️";
              } else if (code >= 61 && code <= 65) {
                desc = "Hujan";
                icon = "🌧️";
              } else if (code >= 80 && code <= 82) {
                desc = "Hujan Lebat";
                icon = "🌧️";
              } else if (code >= 95 && code <= 99) {
                desc = "Hujan Badai";
                icon = "⛈️";
              }
              
              const weatherTemp = document.querySelector(".weather-temp");
              const weatherDesc = document.querySelector(".weather-desc");
              const weatherIcon = document.querySelector(".weather-icon");
              const weatherDetails = document.querySelector(".weather-details");
              
              if (weatherTemp) weatherTemp.textContent = temp + "°C";
              if (weatherDesc) weatherDesc.textContent = desc;
              if (weatherIcon) weatherIcon.textContent = icon;
              if (weatherDetails) {
                weatherDetails.innerHTML = 
                  '<span id="weatherLocation">📍 ' + escapeHtml(clusterName) + '</span>' +
                  '<span>💧 Hum: ' + hum + '%</span>';
              }
            }
          })
          .catch(err => {
            console.error("Error fetching live weather:", err);
          });
      }
      // ────────────────────────────────────────────────────────────────────────
    

      // Intercept module clicks if no company selected
      document.addEventListener('DOMContentLoaded', () => {
        const modulList = document.querySelector('.modul-list');
        if (modulList) {
          modulList.addEventListener('click', (e) => {
            if (!selectedCompanyId) {
              e.stopPropagation();
              e.preventDefault();
              showToast('⚠️ Pilih Cluster dan PT terlebih dahulu sebelum membuka modul!', 'warning');
            }
          }, true); // Intercept di fase capture sebelum onclick jalan
        }
      });

      // Intercept message from iframe for inner navigation without breaking out
      window.addEventListener("message", function(event) {
        if (event.data && event.data.type === "navigate") {
          const iframe = document.querySelector('iframe[title="Web App View"]');
          if (iframe) {
            iframe.src = event.data.url;
          }
        }
      });

    </script>
